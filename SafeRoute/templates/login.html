{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card sr-auth-card">
            <div class="card-body p-4 p-sm-5">
                <h1 class="h4 mb-1">Welcome back</h1>
                <p class="text-muted-small mb-4">Log in to your SafeRoute account.</p>

                <form method="post" action="{{ url_for('login') }}" data-validate novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email"
                               value="{{ email }}" autocomplete="email" placeholder="you@example.com" required autofocus>
                        <div class="invalid-feedback">Please enter your email address.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password" name="password"
                               autocomplete="current-password" required>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>

                <p class="text-center text-muted-small mt-4 mb-0">
                    Don't have an account?
                    <a href="{{ url_for('register') }}">Create Account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
